name: Build and Test website

on:
  workflow_dispatch: {}
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0

      - name: Setup tools with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # jdx/mise-action v5.2.7

      - run: npm install
      - run: npm run build

  cypress:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4.4.0
      - name: Setup tools with mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # jdx/mise-action v5.2.7
      - run: npm install

      # https://docs.cypress.io/guides/continuous-integration/github-actions
      - name: Cypress run
        # https://github.com/marketplace/actions/cypress-io
        uses: cypress-io/github-action@be1bab96b388bbd9ce3887e397d373c8557e15af # cypress-io/github-action v6.9.2
        with:
          start: npm run dev -- --host
          wait-on: "http://localhost:3000"
